version: 2

models:
  - name: rep_sales_funnel_monthly
    description: Monthly counts of deals reaching each funnel KPI step.
    columns:
      - name: month
        tests: [not_null]
      - name: kpi_name
        tests:
          - accepted_values:
              arguments:
                values:
                  - "Lead Generation"
                  - "Qualified Lead"
                  - "Sales Call 1"
                  - "Needs Assessment"
                  - "Sales Call 2"
                  - "Proposal/Quote Preparation"
                  - "Negotiation"
                  - "Closing"
                  - "Implementation/Onboarding"
                  - "Follow-up/Customer Success"
                  - "Renewal/Expansion"
      - name: funnel_step
        tests:
          - accepted_values:
              arguments:
                values: ["1","2","2.1","3","3.1","4","5","6","7","8","9"]
      - name: deals_count
        tests: [not_null]
